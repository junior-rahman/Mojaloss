name: Android build and unit tests

# Builds this repository's own source on every change. Uses only local fixtures;
# never contacts the MojaLoss service and never publishes anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify the checked-in Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: >
          ./gradlew --no-daemon
          :core:model:test :core:ui:testDebugUnitTest :core:data:testDebugUnitTest
          :core:downloads:testDebugUnitTest :core:player:testDebugUnitTest :app:testDebugUnitTest

      - name: Compile instrumented tests
        run: >
          ./gradlew --no-daemon
          :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest :core:downloads:assembleDebugAndroidTest

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
